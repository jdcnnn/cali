<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=wordmark-cap-1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=wordmark-cap-1" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=wordmark-cap-1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cali" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="CALI (Class Ally) is a student workspace for academic planning and study."
    />

    <meta name="theme-color" content="#F6FCFF" />

    <script>
      try {
        const saved = localStorage.getItem('cali-theme')
        const preference = saved === 'light' || saved === 'dark' ? saved : 'system'
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0C202B' : '#F6FCFF'
      } catch {
        const dark = matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#0C202B' : '#F6FCFF'
      }
    </script>

    <title>Cali</title>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
